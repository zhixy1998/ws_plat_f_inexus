spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  datasource:
    dynamic:
      primary: guide #设置默认的数据源
      strict: false #设置严格模式，默认false的情况下，如果配置了数据源，但是没有对应的数据源，则使用默认的数据源
      datasource:
        guide:
          url: jdbc:mysql://192.168.61.82:3306/t800_uv_inexus?useSSL=false&serverTimezone=UTC
          username: root
          password: px123456
          driver-class-name: com.mysql.cj.jdbc.Driver
        concise:
          url: jdbc:mysql://192.168.61.82:3306/t800_uv_inexus_concise?useSSL=false&serverTimezone=UTC
          username: root
          password: px123456
          driver-class-name: com.mysql.cj.jdbc.Driver
        factory_inspection:
          url: jdbc:mysql://192.168.61.82:3306/t800_uv_inexus_factory_inspection?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
          username: root
          password: px123456
          driver-class-name: com.mysql.cj.jdbc.Driver

