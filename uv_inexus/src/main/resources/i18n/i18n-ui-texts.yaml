# =====================================================
# UI 文本翻译字典 - 中英日俄四语
#
# 本文件: i18n-ui-texts.yaml — WebSocket 推送 / 前端展示的中文文本翻译
#   key 格式: 中文原文（OutputTranslator 自动匹配翻译）
#   用途: 后端逻辑保持中文不变，仅在 WebSocket 推送出口处翻译
#
# API 消息码文件: i18n-dictionary.yaml
#   key 格式: 8位十六进制消息码
#
# 新增翻译:
#   如果后端推送到前端的 JSON 中包含新的中文文本，
#   在此文件中以中文原文为 key 添加三语翻译即可
# =====================================================

